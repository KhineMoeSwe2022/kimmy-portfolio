<script>
let mmenu;

function initMobileMenu() {
  if (window.innerWidth < 1024 && !mmenu) {
    mmenu = new Mmenu("#mobile-menu", {
     navbars: [
              {
                position: "top",
                content: [
                    "prev",
                  "close"
                ]
              }
            ],
      "offCanvas": {
          "position": "right"
        },

        "theme": "light"
    });
  }
}

initMobileMenu();

window.addEventListener("resize", () => {
  if (window.innerWidth < 1024 && !mmenu) {
    initMobileMenu();
  }
});


        </script>
